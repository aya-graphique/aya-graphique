<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/aya-graphique/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="آية عطية عابد؛ مصممة إعلانات وهويات بصرية ورسامة مصرية، ومؤسسة Aya's Graphique. تصفح أعمالها وتسوّق منتجاتها المرسومة يدويًا.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="aya_graphique">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Aya's Graphique</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0D0512">

  <!-- Brand background immediately (no white flash), plus a pure
       CSS/HTML loading indicator with a numeric percentage.

       Important note: the browser has no reliable way to report real
       byte-level download progress for Flutter's own bootstrap
       (flutter_bootstrap.js is auto-generated on every `flutter build`,
       so we can't safely hook into its internals without it breaking on
       the next build). So this is a smooth, decelerating *estimated*
       percentage — it always reaches 100% and disappears at exactly the
       right moment (when main.dart calls window.hideAppLoader() after
       the real UI's first frame), it just isn't tied to literal bytes
       downloaded in between. -->
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #0D0512;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background-color: #0D0512;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }

    #app-loading .ring-wrap {
      position: relative;
      width: 64px;
      height: 64px;
    }

    #app-loading svg {
      width: 64px;
      height: 64px;
      transform: rotate(-90deg);
    }

    #app-loading circle {
      fill: none;
      stroke-width: 4;
    }

    #app-loading .ring-bg {
      stroke: rgba(255, 255, 255, 0.14);
    }

    #app-loading .ring-fg {
      stroke: #B78CE0; /* light violet accent on the dark brand bg */
      stroke-linecap: round;
      transition: stroke-dashoffset 0.15s linear;
    }

    #app-loading .ring-percent {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
    }

    #app-loading.app-loading-hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="ring-wrap">
      <svg viewBox="0 0 64 64">
        <circle class="ring-bg" cx="32" cy="32" r="28"></circle>
        <circle class="ring-fg" id="app-loading-ring" cx="32" cy="32" r="28"></circle>
      </svg>
      <div class="ring-percent" id="app-loading-percent">0%</div>
    </div>
  </div>

  <script>
    (function () {
      var RADIUS = 28;
      var CIRCUMFERENCE = 2 * Math.PI * RADIUS;
      var ring = document.getElementById('app-loading-ring');
      var label = document.getElementById('app-loading-percent');
      var overlay = document.getElementById('app-loading');
      ring.style.strokeDasharray = CIRCUMFERENCE.toFixed(1);
      ring.style.strokeDashoffset = CIRCUMFERENCE.toFixed(1);

      var progress = 0;
      var done = false;
      var tickTimer = null;

      function paint(p) {
        var clamped = Math.max(0, Math.min(100, p));
        label.textContent = Math.round(clamped) + '%';
        ring.style.strokeDashoffset =
          (CIRCUMFERENCE * (1 - clamped / 100)).toFixed(1);
      }

      // Ticks up quickly at first, then decelerates as it approaches 90%
      // — never claims 100% on its own, since we don't actually know
      // when things are done until Flutter tells us.
      tickTimer = setInterval(function () {
        if (done) return;
        progress += (90 - progress) * 0.06;
        paint(progress);
      }, 100);

      // Called from lib/main.dart (WidgetsBinding.instance.addPostFrameCallback)
      // right after the real Flutter UI paints its first frame.
      window.hideAppLoader = function () {
        if (done) return;
        done = true;
        clearInterval(tickTimer);
        paint(100);
        setTimeout(function () {
          overlay.classList.add('app-loading-hidden');
          setTimeout(function () {
            if (overlay && overlay.parentNode) {
              overlay.parentNode.removeChild(overlay);
            }
          }, 400);
        }, 150);
      };

      // Safety net: if something goes wrong (very old browser, network
      // failure mid-boot, etc.) and Flutter never gets a chance to call
      // hideAppLoader itself, don't leave visitors staring at a spinner
      // forever — drop it after 20s regardless.
      setTimeout(function () {
        if (window.hideAppLoader) window.hideAppLoader();
      }, 20000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
