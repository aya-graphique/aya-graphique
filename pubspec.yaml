name: aya_graphique
description: "Aya's Graphique — a notebooks & stationery e-commerce app, built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Scroll-reveal / entrance animations
  flutter_animate: ^4.5.0

  # Detects when a section scrolls into view, to trigger animations
  visibility_detector: ^0.4.0+2

  # Opens mailto links from the checkout confirmation
  url_launcher: ^6.3.0

  # Supabase backend — product catalog + admin dashboard
  supabase_flutter: ^2.6.0

  # Cart / theme state
  provider: ^6.1.2

  # Persists the light/dark mode choice across app restarts
  shared_preferences: ^2.3.2

  # Order date formatting
  intl: ^0.19.0

  # Lets the admin dashboard upload product photos straight from disk
  file_picker: ^8.1.2

  # Pure-Dart resize/re-encode so banner photos (often multi-MB, full
  # camera resolution) get shrunk before upload instead of hitting
  # Supabase Storage — and every visitor's phone — at full size. Pure
  # Dart (no platform channels), so it works on web too, unlike
  # flutter_image_compress.
  image: ^4.2.0

  cupertino_icons: ^1.0.8

  # Native/web share sheet for the product card's "Share" button
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#4b1d6b"
    theme_color: "#4b1d6b"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/certificates/
    - assets/images/projects/project_2/
    - assets/icon/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
